# Skuiz CI: the checks that keep the local discipline enforced.
#
# The Windows job matters more than usual here — development happens on
# macOS, so this is the only place the Windows named-pipe transport and the
# rest of the Windows code paths actually *execute* rather than just
# type-check. A Windows failure is a real finding, not noise.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # wry (webkit2gtk), tao (gtk + dbus) and cpal (alsa) link system
      # libraries on Linux.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libasound2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --workspace deliberately includes skuiz-vst3, which is excluded from
      # default *builds* for licensing reasons but must always stay tested.
      - name: Test
        run: cargo test --workspace

      # The libpd feature vendors and compiles Pure Data, so it is opt-in;
      # exercised on macOS where it is known to build.
      - name: Test libpd integration
        if: runner.os == 'macOS'
        run: cargo test -p skuiz-dsp --features libpd

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every example plugin must stay clean under the official CLAP validator.
  clap-validation:
    name: clap-validator (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install clap-validator
        run: cargo install --git https://github.com/free-audio/clap-validator.git --locked

      - name: Validate example plugins
        run: |
          set -eu
          for example in shared-gain trigger-note solid-synth; do
            ./examples/$example/bundle.sh
            clap-validator validate "target/$example.clap"
          done

  # The SolidJS editor's reactive wiring, checked headlessly: mount effects
  # push every parameter, changes reach the DSP, incoming values are not
  # echoed back.
  editor:
    name: editor (headless DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Solid editor
        run: |
          npm install --no-save jsdom
          node examples/solid-synth/verify-editor.mjs
