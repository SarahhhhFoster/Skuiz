# Skuiz CI: the checks that keep the local discipline enforced.
#
# The Windows job matters more than usual here — development happens on
# macOS, so this is the only place the Windows named-pipe transport and the
# rest of the Windows code paths actually *execute* rather than just
# type-check. A Windows failure is a real finding, not noise.

name: CI

# Switched off to keep Actions cost at zero: the workflow runs only when
# triggered manually from the Actions tab. To re-enable automatic runs,
# restore the triggers:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # wry (webkit2gtk), tao (gtk + dbus) and cpal (alsa) link system
      # libraries on Linux.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libasound2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The libpd feature vendors and compiles Pure Data, so it is opt-in;
      # exercised on macOS where it is known to build. pd-tremolo is an empty
      # crate without the feature, so default workspace builds skip Pd.
      - name: Test libpd integration
        if: runner.os == 'macOS'
        run: cargo test -p skuiz-dsp -p pd-tremolo --features libpd

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Every example plugin must stay clean under the official CLAP validator.
  clap-validation:
    name: clap-validator (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install clap-validator
        run: cargo install --git https://github.com/free-audio/clap-validator.git --locked

      - name: Validate example plugins
        run: |
          set -eu
          for example in shared-gain trigger-note solid-synth pd-tremolo; do
            ./examples/$example/bundle.sh
            clap-validator validate "target/$example.clap"
          done

      # The scaffolding tooling is how users start their own plugin, so it
      # gets the same end-to-end check: copy an example out of the tree,
      # build it standalone, install it, validate the installed bundle.
      - name: Scaffold, install and validate a copied example
        run: |
          set -eu
          ./tools/new-plugin.sh ci-probe trigger-note "$RUNNER_TEMP"
          CLAP_INSTALL_DIR="$RUNNER_TEMP/plugins" "$RUNNER_TEMP/ci-probe/install.sh"
          clap-validator validate "$RUNNER_TEMP/plugins/ci-probe.clap"

  # Same discipline for VST3: Steinberg's own validator. The SDK is MIT
  # since v3.8, so CI clones and builds it from source. The Xcode generator
  # is required — with Unix Makefiles, CMake never enables OBJCXX and the
  # SDK's .mm files silently compile to nothing.
  vst3-validation:
    name: vst3-validator (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Steinberg's validator
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          cmake -G Xcode -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3sdk/build"
          cmake --build "$RUNNER_TEMP/vst3sdk/build" --target validator --config Release

      - name: Validate example VST3 plugins
        run: |
          set -eu
          ./examples/shared-gain/bundle-vst3.sh
          "$RUNNER_TEMP/vst3sdk/build/bin/Release/validator" target/shared-gain.vst3

  # The SolidJS editor's reactive wiring, checked headlessly: mount effects
  # push every parameter, changes reach the DSP, incoming values are not
  # echoed back.
  editor:
    name: editor (headless DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Solid editor
        run: |
          npm install --no-save jsdom
          node examples/solid-synth/verify-editor.mjs
