<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 18px;
    background: #17171b; color: #e6e6ea;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .01em; }
  .sub { color: #85858f; font-size: 11px; margin-bottom: 16px; }
  .row { margin-bottom: 14px; }
  .label { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .label b { font-weight: 600; }
  .val { color: #7fb2ff; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #7fb2ff; }
  .waves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .waves button {
    font: inherit; padding: 6px 0; border-radius: 6px; cursor: pointer;
    background: #24242b; color: #cfcfd6; border: 1px solid #34343d;
  }
  .waves button[data-on="true"] { background: #7fb2ff; color: #10101a; border-color: #7fb2ff; }
  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
  .keys button {
    font: inherit; padding: 9px 0; border-radius: 5px; cursor: pointer;
    background: #24242b; color: #cfcfd6; border: 1px solid #34343d;
  }
  .keys button[data-on="true"] { background: #2f5d9e; color: #fff; border-color: #4d82cf; }
  .note { margin-top: 14px; font-size: 11px; color: #6f6f79; border-top: 1px solid #26262e; padding-top: 10px; }
  code { color: #9ecbff; }
</style>
