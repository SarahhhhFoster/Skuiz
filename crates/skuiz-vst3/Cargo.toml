[package]
name = "skuiz-vst3"
description = "VST3 format adapter for Skuiz processors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
skuiz-core.workspace = true
skuiz-ipc = { path = "../skuiz-ipc" }
skuiz-ui.workspace = true
# Clean-room, MIT/Apache-2.0 bindings (the Coupler project's vst3-rs).
# Nothing from Steinberg's SDK is vendored or linked — and since the SDK
# itself went MIT in v3.8 (October 2025), shipping a VST3 binary carries no
# Steinberg licensing obligation. Only the "VST" trademark usage guidelines
# still apply, and only if you brand with the name or logo.
vst3 = "0.3"
