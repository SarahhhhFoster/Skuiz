[workspace]
resolver = "2"
members = [
    "crates/skuiz-core",
    "crates/skuiz-clap",
    "crates/skuiz-ui",
    "crates/skuiz-ipc",
    "crates/skuiz-midi",
    "crates/skuiz-dsp",
    "crates/skuiz-vst3",
    "crates/skuiz-auv3",
    "crates/skuiz-standalone",
    "examples/shared-gain",
    "examples/trigger-note",
    "examples/solid-synth",
    "examples/pd-tremolo",
]

# Every member is a default member: the reason skuiz-vst3 was excluded
# (Steinberg's GPLv3-or-proprietary licence on shipping a VST3 binary) ended
# when the VST3 SDK went MIT in v3.8 (October 2025).
default-members = [
    "crates/skuiz-core",
    "crates/skuiz-clap",
    "crates/skuiz-ui",
    "crates/skuiz-ipc",
    "crates/skuiz-midi",
    "crates/skuiz-dsp",
    "crates/skuiz-vst3",
    "crates/skuiz-auv3",
    "crates/skuiz-standalone",
    "examples/shared-gain",
    "examples/trigger-note",
    "examples/solid-synth",
    "examples/pd-tremolo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SarahhhhFoster/Skuiz"

[workspace.dependencies]
skuiz-core = { path = "crates/skuiz-core" }
skuiz-clap = { path = "crates/skuiz-clap" }
skuiz-ui = { path = "crates/skuiz-ui" }
skuiz-ipc = { path = "crates/skuiz-ipc" }
skuiz-midi = { path = "crates/skuiz-midi" }
skuiz-dsp = { path = "crates/skuiz-dsp" }
skuiz-vst3 = { path = "crates/skuiz-vst3" }
skuiz-standalone = { path = "crates/skuiz-standalone" }
clap-sys = "0.5"
